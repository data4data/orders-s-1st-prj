name: CI

# Runs on every PR and push to the three environment branches (architecture.md §11).
on:
  pull_request:
    branches: [test, stage, production]
  push:
    branches: [test, stage, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (lint, static analysis, architecture, tests)
    runs-on: ubuntu-latest
    env:
      # The tests create their own database (myoils_test); the throwaway CI container's root user may do that.
      DATABASE_URL: mysql://root:root@127.0.0.1:3307/myoils?serverVersion=8.4.0&charset=utf8mb4
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: myoils
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Build container for PHPStan
        run: php bin/console cache:warmup --env=dev
      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress
      - name: Architecture rules (deptrac)
        run: vendor/bin/deptrac analyse --no-progress
      - name: Tests
        run: vendor/bin/phpunit

  js:
    name: Frontend (lint, no-emoji, build, CSS isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint (includes the Bootstrap/Vue import ban)
        run: npm run lint
      - name: No emojis
        run: npm run check:no-emoji
      - name: Build (three isolated entries)
        run: npm run build
      - name: CSS isolation check
        run: npm run check:css-isolation
