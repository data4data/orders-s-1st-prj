doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MySQL commits implicitly on every CREATE/ALTER TABLE, so a wrapping transaction cannot roll
    # schema changes back anyway, and it breaks when migrations run inside other transactions.
    transactional: false
