security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        staff_users:
            entity:
                class: App\Entity\StaffUser
                property: email
        # Customers belong to one store: the tenant filter (set from the host before the firewall
        # runs) limits the lookup to the current shop (decision #6).
        customers:
            entity:
                class: App\Entity\Customer
                property: email

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_STAFF]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Admin on its own host (decision #29). Staff users are global; the store they work in
        # comes from the store switcher (AdminTenantListener).
        admin:
            host: ^admin\.
            lazy: true
            provider: staff_users
            entry_point: App\UI\Http\Security\AdminAuthenticationEntryPoint
            form_login:
                login_path: admin_login_page
                check_path: admin_login_page
                default_target_path: admin_app
                enable_csrf: true
            json_login:
                check_path: admin_login
            # 5 failed logins per 15 minutes per IP + email, then 429 (pages.html → Rate limits).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: admin_logout
                target: admin_login_page
                enable_csrf: true
                csrf_token_id: api
                csrf_parameter: _csrf_token

        # Storefront customers (Phase 5): Twig login form, 5 failed attempts per 15 minutes.
        main:
            lazy: true
            provider: customers
            entry_point: App\UI\Http\Security\CustomerAuthenticationEntryPoint
            form_login:
                login_path: customer_login
                check_path: customer_login
                default_target_path: account
                enable_csrf: true
                username_parameter: email
                password_parameter: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: customer_logout
                target: home
                enable_csrf: true
                csrf_token_id: logout

    access_control:
        - { path: ^/login$, host: ^admin\., roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/csrf-token$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_STAFF }
        - { path: ^/api/account, roles: ROLE_CUSTOMER }
        - { path: ^/account, host: ^(?!admin\.), roles: ROLE_CUSTOMER }
        # The admin SPA itself: every admin-host page that is not an API call, asset or file
        # (files like /favicon.ico must never become the "return to" page after login).
        - { path: ^/(?!api/|build/|_)[^.]*$, host: ^admin\., roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
