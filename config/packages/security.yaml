security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        staff_users:
            entity:
                class: App\Entity\StaffUser
                property: email

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_STAFF]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Admin on its own host (decision #29). Staff users are global; the store they work in
        # comes from the store switcher (AdminTenantListener). The Twig login page follows in Phase 5.
        admin:
            host: ^admin\.
            lazy: true
            provider: staff_users
            json_login:
                check_path: admin_login
            logout:
                path: admin_logout

        # Storefront. Customer login (per store) is added in Phase 5.
        main:
            lazy: true
            provider: staff_users

    access_control:
        - { path: ^/api/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
