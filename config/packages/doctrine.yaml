doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '8.4.0'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        filters:
            # Scopes every query on tenant entities to the active store. Enabled from the start,
            # so anything without a store sees no tenant rows (fail closed, decision #30).
            tenant:
                class: App\Infrastructure\Tenancy\Doctrine\TenantFilter
                enabled: true
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
        orm:
            mappings:
                # Test-only entities (e.g. TenantNote for the store isolation tests).
                TestFixtures:
                    type: attribute
                    is_bundle: false
                    dir: '%kernel.project_dir%/tests/Fixtures/Entity'
                    prefix: 'App\Tests\Fixtures\Entity'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
