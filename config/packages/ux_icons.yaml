# Icons: Lucide only (decision #54). Semantic names live in assets/shared/icons.json and are
# resolved by the Twig icon() function. Lucide icons are stroke-based, so no default `fill`.
ux_icons:
    default_icon_attributes:
        height: '1em'
        width: '1em'
        class: 'icon'
        aria-hidden: 'true'
    ignore_not_found: false

when@dev:
    ux_icons:
        iconify:
            # Downloads a missing icon on first use and saves it to assets/icons/ (commit it).
            auto_lock: true

when@prod:
    ux_icons:
        ignore_not_found: true
