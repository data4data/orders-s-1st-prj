# Rate limits (docs/diagrams/pages.html → Error handling → Rate limits). Every 429 carries Retry-After.
framework:
    rate_limiter:
        storefront_api: { policy: sliding_window, limit: 300, interval: '1 minute' }
        admin_api: { policy: sliding_window, limit: 600, interval: '1 minute' }
        registration: { policy: fixed_window, limit: 5, interval: '1 hour' }
        password_reset: { policy: fixed_window, limit: 3, interval: '1 hour' }
        contact_form: { policy: fixed_window, limit: 3, interval: '10 minutes' }
        coupon_apply: { policy: sliding_window, limit: 10, interval: '10 minutes' }
        checkout: { policy: sliding_window, limit: 10, interval: '10 minutes' }
        # UI kit demo only (dev): lets you trigger a real 429 by clicking a few times.
        ui_kit_demo: { policy: fixed_window, limit: 3, interval: '1 minute' }
